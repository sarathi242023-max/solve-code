<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up — Solve Code</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="auth-body">
<div class="auth-container">
  <div class="auth-brand"><a href="/" class="logo"><span class="logo-mark">&lt;/&gt;</span> Solve<span>Code</span></a></div>
  <div class="auth-card">
    <h1>Create Account 🚀</h1><p>Start your coding journey today.</p>
    <button class="google-btn" onclick="googleSignup()"><span>G</span> Sign up with Google</button>
    <div class="divider"><span>or create with email</span></div>
    <form id="signupForm"><label>Full Name</label><input id="name" type="text" placeholder="Your name" required><label>Email</label><input id="email" type="email" placeholder="you@example.com" required><label>Password</label><input id="password" type="password" placeholder="Create password" required><button class="primary-btn full-btn" type="submit">Create Account</button></form>
    <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
  </div>
</div>
<script>
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,email:email.value,password:password.value})});
  const d = await r.json(); d.success ? location.href=d.redirect : alert(d.message);
});
function googleSignup(){ alert("Configure Google OAuth credentials and /auth/google routes to enable Google signup."); }
</script>
</body>
</html>
